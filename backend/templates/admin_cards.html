<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Cartas - Miedo y Hambre</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        #admin-screen {
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, rgba(167, 139, 250, 0.15) 0%, transparent 60%), var(--bg-darker);
        }
        
        #card-preview {
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }
        
        #card-preview .card {
            transform: scale(0.9);
        }
        
        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }
        
        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
        }
        
        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: #6ee7b7;
        }
        
        textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            transition: all 0.3s ease;
        }
        
        textarea:focus {
            outline: none;
            border-color: #a78bfa;
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.5);
        }
        
        select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            appearance: none;
        }
        
        .btn-purple {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            box-shadow: 0 10px 20px -10px rgba(139, 92, 246, 0.5);
        }
        
        .btn-purple:hover {
            box-shadow: 0 15px 25px -10px rgba(139, 92, 246, 0.8);
        }
    </style>
</head>

<body>
    <div id="admin-screen" class="screen active">
        <div class="glass-panel" style="max-width: 500px;">
            <h1 style="background: linear-gradient(to right, #c4b5fd, #a78bfa); -webkit-background-clip: text;">Taller de Cartas</h1>
            <p class="subtitle">Añade nuevas cartas al juego en tiempo real</p>
            
            <div id="alert-msg" class="alert"></div>
            
            <div class="form-group">
                <label for="card-type">Tipo de Carta</label>
                <select id="card-type">
                    <option value="white">Carta Blanca (Respuesta)</option>
                    <option value="black">Carta Negra (Pregunta)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="card-text">Texto de la Carta</label>
                <textarea id="card-text" placeholder="Escribe aquí el contenido... Usa un _ (guión bajo) para los espacios en blanco de las cartas negras."></textarea>
            </div>
            
            <div class="form-group hidden" id="pick-group">
                <label for="card-pick">Cartas blancas necesarias (Pick)</label>
                <input type="number" id="card-pick" value="1" min="1" max="3">
            </div>
            
            <div id="card-preview">
                <div id="preview-box" class="card white">
                    <div id="preview-text" class="card-text">Tu texto aparecerá aquí...</div>
                    <div class="card-footer">Cartas Contra Miedo y Hambre</div>
                </div>
            </div>
            
            <button id="add-btn" class="btn-primary btn-purple">Subir Carta al Servidor</button>
            <a href="/" style="display: block; margin-top: 1.5rem; color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;">Volver al inicio</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script>
        const socket = io();
        const typeSelect = document.getElementById('card-type');
        const textInput = document.getElementById('card-text');
        const pickGroup = document.getElementById('pick-group');
        const pickInput = document.getElementById('card-pick');
        const previewBox = document.getElementById('preview-box');
        const previewText = document.getElementById('preview-text');
        const addBtn = document.getElementById('add-btn');
        const alertMsg = document.getElementById('alert-msg');
        
        function updatePreview() {
            const isBlack = typeSelect.value === 'black';
            const val = textInput.value || "Tu texto aparecerá aquí...";
            
            if (isBlack) {
                previewBox.className = 'card black';
                previewText.innerHTML = val.replace(/_/g, '______');
                pickGroup.classList.remove('hidden');
            } else {
                previewBox.className = 'card white';
                previewText.textContent = val;
                pickGroup.classList.add('hidden');
            }
        }
        
        typeSelect.addEventListener('change', updatePreview);
        textInput.addEventListener('input', updatePreview);
        
        function showAlert(msg, isError) {
            alertMsg.textContent = msg;
            alertMsg.className = 'alert ' + (isError ? 'alert-error' : 'alert-success');
            alertMsg.style.display = 'block';
            setTimeout(() => { alertMsg.style.display = 'none'; }, 6000);
        }
        
        addBtn.addEventListener('click', () => {
            const type = typeSelect.value;
            const text = textInput.value.trim();
            const pick = parseInt(pickInput.value) || 1;
            
            if (!text) {
                showAlert('El texto no puede estar vacío.', true);
                return;
            }
            
            addBtn.disabled = true;
            addBtn.textContent = 'Verificando...';
            
            socket.emit('add_custom_card', { type, text, pick });
        });
        
        socket.on('custom_card_result', (data) => {
            addBtn.disabled = false;
            addBtn.textContent = 'Subir Carta al Servidor';
            
            if (data.success) {
                showAlert('¡Carta añadida con éxito! Ya está disponible en las partidas activas.', false);
                textInput.value = '';
                updatePreview();
            } else {
                showAlert('Error: ' + data.message, true);
            }
        });
    </script>
</body>
</html>
