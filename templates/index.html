<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartas Contra Miedo y Hambre</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="login-screen" class="screen active">
        <div class="glass-panel">
            <h1>Cartas Contra Miedo y Hambre</h1>
            <p class="subtitle">Porque ninguna version web va bien coño</p>

            <div class="form-group">
                <label for="username">Tu Nombre</label>
                <input type="text" id="username" placeholder="Ej: Bastiooon" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="room_id">Código de Sala</label>
                <input type="text" id="room_id" placeholder="Ej: CACA" autocomplete="off"
                    style="text-transform: uppercase;">
            </div>

            <button id="join-btn" class="btn-primary">Unirse a la partida</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <header class="game-header">
            <h2>Sala: <span id="display-room"></span></h2>
            <div class="header-right">
                <span id="player-name"></span>
                <span class="badge">Puntos: <span id="player-points">0</span></span>
            </div>
        </header>

        <div class="game-layout">
            <aside class="sidebar">
                <div class="sidebar-top">
                    <h3>Jugadores</h3>
                    <ul id="leaderboard">
                        <!-- Jugadores renderizados aqui -->
                    </ul>
                    <div id="game-controls">
                        <button id="invite-btn" class="btn-secondary" style="margin-bottom: 0.5rem; width: 100%; border: 1px dashed var(--accent);">Copiar Link Invitación</button>
                        <button id="start-btn" class="btn-secondary hidden">Iniciar Partida</button>
                        <button id="renew-btn" class="btn-secondary hidden">Renovar Cartas</button>
                    </div>
                </div>
                <div class="sidebar-bottom">
                    <h3>Chat</h3>
                    <div id="chat-messages" class="chat-messages"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="Escribe un mensaje..." autocomplete="off">
                        <button id="chat-send-btn">Enviar</button>
                    </div>
                </div>
            </aside>

            <main class="board">
                <div id="status-bar">Esperando a que empiece la partida...</div>
                
                <div id="room-custom-cards" class="hidden" style="margin-top: 2rem; max-width: 600px; width: 100%; align-self: center; background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 16px; border: 1px solid var(--glass-border);">
                    <label for="custom-cards-input" style="color: var(--text-primary); text-align: left; display: block; margin-bottom: 0.5rem; font-weight: 600;">Añadir Cartas Blancas Locales (separadas por coma)</label>
                    <div style="display: flex; gap: 0.5rem; width: 100%;">
                        <input type="text" id="custom-cards-input" class="form-group" placeholder="Ej: Mi suegra, Un gato ninja, Patatas bravas" autocomplete="off" style="flex: 1; margin-bottom: 0; padding: 0.75rem; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: white;">
                        <button id="add-custom-cards-btn" class="btn-secondary" style="margin-top: 0; width: auto;">Añadir</button>
                    </div>
                    <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.5rem; text-align: left;">Estas cartas solo se usarán en esta sala y no se guardarán en el juego principal.</p>
                </div>

                <div class="center-area">
                    <div id="black-card-wrapper" style="display: flex; flex-direction: column; align-items: center;">
                        <div id="black-card-slot" class="card black hidden">
                            <div class="card-text"></div>
                            <div class="card-footer">Cartas Contra Miedo y Hambre</div>
                        </div>
                        <button id="change-black-btn" class="btn-secondary hidden"
                            style="margin-top: 1rem; width: 100%; max-width: 220px;">Cambiar Carta Negra</button>
                    </div>

                    <div id="played-cards-area" class="played-cards hidden">
                        <!-- Cartas jugadas por los demas se renderizan aqui -->
                    </div>
                </div>

                <div class="player-hand-container">
                    <h3>Tu Mano</h3>
                    <div id="player-hand" class="player-hand">
                        <!-- Cartas blancas en mano -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Cargar Socket.IO automáticamente expuesto por Flask-SocketIO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
